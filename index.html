<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Pair</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .box {
            width: 250px;
            height: 350px;
            background-color: #1e1e1e;
            border: 2px dashed #333333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .box:hover {
            background-color: #252525;
            border-color: #555555;
            transform: translateY(-5px);
        }

        .plus-icon {
            font-size: 4rem;
            color: #444444;
            user-select: none;
            transition: color 0.3s ease;
        }

        .box:hover .plus-icon {
            color: #888888;
        }

        /* Modal / Window Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        /* 2x5 Grid Layout for Small Choice Boxes */
        .grid-2x5 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 70px);
            gap: 12px;
        }

        .small-box {
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            background-color: #262626; /* Fallback */
        }

        .small-box:hover {
            transform: scale(1.02);
            border-color: #ffffff;
        }

        /* Ad container helper styling */
        .ad-wrapper {
            width: 100%;
            max-width: 728px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>Choose your pair</h1>

    <div class="container">
        <!-- Box 1 -->
        <div class="box" id="box1" onclick="openMenu('box1')">
            <span class="plus-icon">+</span>
        </div>

        <!-- Box 2 -->
        <div class="box" id="box2" onclick="openMenu('box2')">
            <span class="plus-icon">+</span>
        </div>
    </div>

    <!-- Selection Window Overlay -->
    <div class="modal-overlay" id="menuOverlay" onclick="closeMenu(event)">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">Select an Option</h3>
                <button class="close-btn" onclick="closeMenu(event)">&times;</button>
            </div>
            <!-- 2x5 Grid containing 10 small colored selection boxes -->
            <div class="grid-2x5">
                <div class="small-box" style="background-color: #ff4757;" onclick="selectOption('#ff4757')"></div>
                <div class="small-box" style="background-color: #2ed573;" onclick="selectOption('#2ed573')"></div>
                <div class="small-box" style="background-color: #1e90ff;" onclick="selectOption('#1e90ff')"></div>
                <div class="small-box" style="background-color: #ffa502;" onclick="selectOption('#ffa502')"></div>
                <div class="small-box" style="background-color: #9b59b6;" onclick="selectOption('#9b59b6')"></div>
                <div class="small-box" style="background-color: #34495e;" onclick="selectOption('#34495e')"></div>
                <div class="small-box" style="background-color: #1abc9c;" onclick="selectOption('#1abc9c')"></div>
                <div class="small-box" style="background-color: #e67e22;" onclick="selectOption('#e67e22')"></div>
                <div class="small-box" style="background-color: #e84393;" onclick="selectOption('#e84393')"></div>
                <div class="small-box" style="background-color: #6c5ce7;" onclick="selectOption('#6c5ce7')"></div>
            </div>
        </div>
    </div>

    <!-- BEGIN AADS AD UNIT 2454241 -->
    <div class="ad-wrapper">
        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
            <iframe data-aa='2454241' src='//://a-ads.com'
                    style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
    </div>
    <!-- END AADS AD UNIT 2454241 -->

    <script>
        let activeBoxId = null;

        function openMenu(boxId) {
            activeBoxId = boxId;
            document.getElementById('menuOverlay').classList.add('active');
        }

        function closeMenu(event) {
            if (event) event.stopPropagation();
            document.getElementById('menuOverlay').classList.remove('active');
            activeBoxId = null;
        }

        function selectOption(colorHex) {
            if (activeBoxId) {
                const targetBox = document.getElementById(activeBoxId);
                const plusIcon = targetBox.querySelector('.plus-icon');
                
                // Change the main box background color
                targetBox.style.backgroundColor = colorHex;
                targetBox.style.borderColor = 'transparent';
                plusIcon.style.display = 'none';
            }
            closeMenu();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Pair</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .box {
            width: 250px;
            height: 350px;
            background-color: #1e1e1e;
            border: 2px dashed #333333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .box:hover {
            background-color: #252525;
            border-color: #555555;
            transform: translateY(-5px);
        }

        .plus-icon {
            font-size: 4rem;
            color: #444444;
            user-select: none;
            transition: color 0.3s ease;
        }

        .box:hover .plus-icon {
            color: #888888;
        }

        /* Color Selection Overlay Menu */
        .color-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #161616;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .color-menu.active {
            opacity: 1;
            pointer-events: auto;
        }

        .small-box {
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .small-box:hover {
            transform: scale(1.05);
            border-color: #ffffff;
        }

        /* Ad container helper styling */
        .ad-wrapper {
            width: 100%;
            max-width: 728px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>Choose your pair</h1>

    <div class="container">
        <!-- Box 1 -->
        <div class="box" onclick="toggleMenu(this, event)">
            <span class="plus-icon">+</span>
            <div class="color-menu">
                <div class="small-box" style="background-color: #ff4757;" onclick="selectColor(this, '#ff4757', event)"></div>
                <div class="small-box" style="background-color: #2ed573;" onclick="selectColor(this, '#2ed573', event)"></div>
                <div class="small-box" style="background-color: #1e90ff;" onclick="selectColor(this, '#1e90ff', event)"></div>
                <div class="small-box" style="background-color: #ffa502;" onclick="selectColor(this, '#ffa502', event)"></div>
            </div>
        </div>

        <!-- Box 2 -->
        <div class="box" onclick="toggleMenu(this, event)">
            <span class="plus-icon">+</span>
            <div class="color-menu">
                <div class="small-box" style="background-color: #ff4757;" onclick="selectColor(this, '#ff4757', event)"></div>
                <div class="small-box" style="background-color: #2ed573;" onclick="selectColor(this, '#2ed573', event)"></div>
                <div class="small-box" style="background-color: #1e90ff;" onclick="selectColor(this, '#1e90ff', event)"></div>
                <div class="small-box" style="background-color: #ffa502;" onclick="selectColor(this, '#ffa502', event)"></div>
            </div>
        </div>
    </div>

    <!-- BEGIN AADS AD UNIT 2454241 -->
    <div class="ad-wrapper">
        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
            <iframe data-aa='2454241' src='//://a-ads.com'
                    style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
    </div>
    <!-- END AADS AD UNIT 2454241 -->

    <script>
        function toggleMenu(mainBox, event) {
            // Prevent event from bubbling if clicking inside the menu
            if (event.target.closest('.color-menu')) return;
            
            const menu = mainBox.querySelector('.color-menu');
            menu.classList.toggle('active');
        }

        function selectColor(smallBox, colorHex, event) {
            // Stop click from triggering toggleMenu again
            event.stopPropagation();
            
            const mainBox = smallBox.closest('.box');
            const menu = mainBox.querySelector('.color-menu');
            const plusIcon = mainBox.querySelector('.plus-icon');
            
            // Apply chosen color to main box background and hide menu
            mainBox.style.backgroundColor = colorHex;
            mainBox.style.borderColor = 'transparent';
            plusIcon.style.display = 'none';
            menu.classList.remove('active');
        }
    </script>
</body>
</html>

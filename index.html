<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Pair</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .box {
            width: 250px;
            height: 350px;
            background-color: #1e1e1e;
            border: 2px dashed #333333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .box:hover {
            background-color: #252525;
            border-color: #555555;
            transform: translateY(-5px);
        }

        .plus-icon {
            font-size: 4rem;
            color: #444444;
            user-select: none;
            transition: color 0.3s ease;
        }

        .box:hover .plus-icon {
            color: #888888;
        }

        /* Ad container helper styling */
        .ad-wrapper {
            width: 100%;
            max-width: 728px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>Choose your pair</h1>

    <div class="container">
        <div class="box">
            <span class="plus-icon">+</span>
        </div>
        <div class="box">
            <span class="plus-icon">+</span>
        </div>
    </div>

    <!-- BEGIN AADS AD UNIT 2454241 -->
    <div class="ad-wrapper">
        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
            <iframe data-aa='2454241' src='//acceptable.a-ads.com/2454241/?size=Adaptive'
                    style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>
    </div>
    <!-- END AADS AD UNIT 2454241 -->

</body>
</html>
